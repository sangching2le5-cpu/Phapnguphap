<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập tiếng Pháp A1 — Le Nouveau Taxi ! 1 (Leçons 7–12)</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#eef5fd; --card:#fff; --primary:#3f86d0; --primary-d:#2f6cae; --primary-l:#e6f0fb;
  --text:#1d2b3a; --muted:#6b7c93; --border:#dbe7f4;
  --ok:#2b8f57; --ok-bg:#e9f7ef; --bad:#c9483f; --bad-bg:#fdeceb; --warn:#b8801a; --warn-bg:#fdf6e6;
  --r:14px; --sh:0 2px 10px rgba(63,134,208,.10);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55; -webkit-text-size-adjust:100%;
}
#app{max-width:900px;margin:0 auto;padding:16px 14px 70px}
h1,h2,h3{margin:0 0 .5em;line-height:1.25}
h1{font-size:1.5rem}
h2{font-size:1.15rem}
p{margin:0 0 .8em}
.hero{text-align:center;padding:18px 8px 10px}
.hero p.sub{color:var(--muted);font-size:.94rem;margin:0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:16px;border:1px solid var(--border)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mode{
  display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
  background:#f8fbff;border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;
  cursor:pointer;font:inherit;color:inherit;transition:.15s;width:100%;
}
.mode:hover{border-color:var(--primary);background:var(--primary-l);transform:translateY(-1px)}
.mode .ic{font-size:1.35rem}
.mode strong{font-size:.98rem}
.mode small{color:var(--muted);font-size:.82rem;line-height:1.4}
.lessons{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.lesson-btn{
  display:flex;flex-direction:column;gap:2px;text-align:left;background:#f8fbff;border:1.5px solid var(--border);
  border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;transition:.15s;
}
.lesson-btn:hover{border-color:var(--primary);background:var(--primary-l)}
.lesson-btn small{color:var(--muted);font-size:.78rem}
.btn{
  font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1.5px solid transparent;
  transition:.15s;min-height:44px;
}
.btn:focus-visible{outline:3px solid #9cc7ee;outline-offset:2px}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.ghost{background:#fff;color:var(--primary-d);border-color:var(--border)}
.btn.ghost:hover{background:var(--primary-l);border-color:var(--primary)}
.btn.small{padding:7px 13px;font-size:.86rem;min-height:38px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.nav{justify-content:space-between;margin-bottom:12px}
.row.center{justify-content:center}
.submitbar{text-align:center;margin-bottom:12px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.qtitle{font-weight:700;font-size:.95rem;color:var(--primary-d)}
.qcount{font-weight:700;color:var(--muted);font-size:.9rem;white-space:nowrap}
.progress{height:9px;background:#dceaf8;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress .bar{height:100%;background:linear-gradient(90deg,#5aa2e4,#3f86d0);border-radius:99px;transition:width .25s}
.qcard{padding:20px}
.tag{display:inline-block;font-size:.74rem;font-weight:700;letter-spacing:.02em;color:var(--primary-d);
  background:var(--primary-l);border-radius:99px;padding:3px 11px;margin-bottom:12px;text-transform:uppercase}
.qtext{font-size:1.18rem;font-weight:600;margin-bottom:16px;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;transition:.13s;width:100%;
}
.opt:hover{border-color:var(--primary);background:#f6fbff}
.opt:focus-visible{outline:3px solid #9cc7ee;outline-offset:2px}
.opt .letter{
  flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:var(--primary-l);color:var(--primary-d);font-weight:800;font-size:.9rem;
}
.opt.selected{border-color:var(--primary);background:var(--primary-l)}
.opt.selected .letter{background:var(--primary);color:#fff}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:10px}
.navtoggle{background:none;border:none;color:var(--primary-d);font:inherit;font-size:.86rem;font-weight:600;cursor:pointer;padding:6px 0;text-decoration:underline}
.nav-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:220px;overflow-y:auto;padding:4px}
.navcell{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--border);background:#fff;
  font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--muted);
}
.navcell.done{background:#dff0e6;border-color:#a9d8bd;color:#1f6d43}
.navcell.cur{border-color:var(--primary);background:var(--primary);color:#fff}
.scorecard{text-align:center;padding:26px 18px}
.scorecard .big{font-size:2.6rem;font-weight:800;color:var(--primary-d);line-height:1.1}
.scorecard .pct{font-size:1.05rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.scorecard .msg{font-size:1.05rem;font-weight:600}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:16px 0}
.stat{background:#f8fbff;border:1px solid var(--border);border-radius:11px;padding:12px;text-align:center}
.stat .n{font-size:1.4rem;font-weight:800}
.stat .l{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.stat.ok .n{color:var(--ok)} .stat.bad .n{color:var(--bad)} .stat.warn .n{color:var(--warn)}
.revitem{background:#fff;border:1px solid var(--border);border-left:5px solid var(--muted);border-radius:11px;padding:14px;margin-bottom:12px}
.revitem.correct{border-left-color:var(--ok)}
.revitem.incorrect{border-left-color:var(--bad)}
.revitem.blank{border-left-color:var(--warn)}
.revitem .rq{font-weight:600;margin:6px 0 10px}
.ansline{font-size:.92rem;margin:3px 0}
.ansline b{font-weight:700}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.pill.correct{background:var(--ok-bg);color:var(--ok)}
.pill.incorrect{background:var(--bad-bg);color:var(--bad)}
.pill.blank{background:var(--warn-bg);color:var(--warn)}
.expl{background:#f6fbff;border-radius:9px;padding:10px 12px;font-size:.9rem;margin-top:9px;color:#2c4258}
.expl b{color:var(--primary-d)}
.lessonbar{margin-bottom:12px}
.lessonbar .lb-head{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
.lessonbar .lb-track{height:9px;background:#e2eefa;border-radius:99px;overflow:hidden}
.lessonbar .lb-fill{height:100%;background:linear-gradient(90deg,#7db8ea,#3f86d0);border-radius:99px}
details.mistake{border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-bottom:10px;background:#fff}
details.mistake summary{cursor:pointer;font-weight:600;font-size:.94rem}
details.mistake[open] summary{margin-bottom:8px}
.similar{background:var(--warn-bg);border-radius:9px;padding:10px 12px;margin-top:9px;font-size:.9rem}
.similar b{color:var(--warn)}
.notice{background:var(--warn-bg);border:1px solid #f0d9a3;color:#7a5510;border-radius:11px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
.foot{text-align:center;color:var(--muted);font-size:.8rem;margin-top:20px}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef3f9;border-radius:5px;padding:1px 5px;font-size:.85em}
@media(max-width:520px){
  #app{padding:12px 10px 60px}
  .qtext{font-size:1.06rem}
  .card{padding:14px}
  .hero h1{font-size:1.22rem}
  .btn{padding:11px 14px}
  .row.nav .btn{flex:1}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   1. NGÂN HÀNG CÂU HỎI  (Le Nouveau Taxi ! 1 — Leçons 7–12)
   ============================================================ */
const BANK = [];
let _id = 0;
function q(lesson, category, topic, question, options, correct, explanation){
  BANK.push({
    id: ++_id, lesson, category, topic, question, options,
    correct, explanation, difficulty: "A1"
  });
}

const LESSON_NAMES = {
  7: "Shopping",
  8: "Le coin des artistes",
  9: "Appartement à louer",
  10: "C'est par où ?",
  11: "Bon voyage !",
  12: "Marseille"
};

/* ---------------- LEÇON 7 — SHOPPING ---------------- */
/* Từ vựng: quần áo & phụ kiện */
q(7,"vocabulaire","Vêtements","Il fait froid aujourd'hui. Je mets un ______ chaud.",["manteau","tableau","musée","pont"],0,"Trời lạnh nên mặc áo khoác ấm: un manteau.");
q(7,"vocabulaire","Vêtements","Marie porte une jolie ______ rouge pour la fête.",["robe","gare","cuisine","photo"],0,"Une robe = váy/đầm. 'Jolie robe rouge' hợp với ngữ cảnh dự tiệc.");
q(7,"vocabulaire","Vêtements","Pour aller à l'université, Paul porte un ______ et un pantalon.",["pull","île","poète","salon"],0,"Un pull = áo len, mặc cùng pantalon khi đi học.");
q(7,"vocabulaire","Vêtements","Il pleut. Je mets mon ______.",["blouson","poème","jardin","tableau"],0,"Un blouson = áo khoác ngắn, dùng khi trời mưa hoặc se lạnh.");
q(7,"vocabulaire","Vêtements","Pour un entretien, elle porte une ______ blanche.",["chemise","piscine","banque","plage"],0,"Une chemise = áo sơ mi, trang phục phù hợp buổi phỏng vấn.");
q(7,"vocabulaire","Vêtements","En été, je porte un ______ parce qu'il fait chaud.",["tee-shirt","manteau","ascenseur","château"],0,"Mùa hè nóng → mặc áo phông: un tee-shirt.");
q(7,"vocabulaire","Vêtements","Mon père porte un ______ bleu pour travailler.",["jean","île","photo","musée"],0,"Un jean = quần bò. 'Un jean bleu' là cách nói rất tự nhiên.");
q(7,"vocabulaire","Vêtements","Je veux acheter des ______ pour courir.",["baskets","lunettes","chapeaux","chemises"],0,"Des baskets = giày thể thao, dùng để chạy bộ.");
q(7,"vocabulaire","Vêtements","Elle ne voit pas bien. Elle porte des ______.",["lunettes","chaussures","pantalons","manteaux"],0,"Des lunettes = kính. Không nhìn rõ thì đeo kính.");
q(7,"vocabulaire","Vêtements","Je mets mes livres dans mon ______.",["sac","pull","jean","chapeau"],0,"Un sac = túi, dùng để đựng sách.");
q(7,"vocabulaire","Vêtements","En été, il met un ______ sur sa tête.",["chapeau","sac","jean","pull"],0,"Un chapeau = mũ, đội trên đầu (sur la tête).");
q(7,"vocabulaire","Vêtements","Ces ______ sont trop petites pour mes pieds.",["chaussures","lunettes","robes","chemises"],0,"Chaussures = giày, đi ở chân (aux pieds).");
q(7,"vocabulaire","Vêtements","Elle achète une ______ pour l'été : c'est plus léger qu'un manteau.",["robe","gare","poste","cour"],0,"Une robe = váy, nhẹ hơn manteau nên hợp mùa hè.");
q(7,"vocabulaire","Vêtements","Ce ______ est trop petit : je ne peux pas mettre mes bras.",["manteau","bus","pont","film"],0,"Manteau là áo khoác; nếu quá nhỏ thì không mặc vừa.");
/* Từ vựng: màu sắc */
q(7,"vocabulaire","Couleurs","Le ciel est généralement ______ quand il fait beau.",["bleu","rouge","noir","gris"],0,"Trời đẹp thì bầu trời thường màu xanh dương: bleu.");
q(7,"vocabulaire","Couleurs","La tomate est souvent ______.",["rouge","jaune","verte","blanche"],0,"Cà chua thường có màu đỏ: rouge.");
q(7,"vocabulaire","Couleurs","L'herbe est ______.",["verte","grise","noire","bleue"],0,"Cỏ màu xanh lá: verte (herbe là danh từ giống cái).");
q(7,"vocabulaire","Couleurs","La neige est ______.",["blanche","rouge","jaune","verte"],0,"Tuyết màu trắng: blanche (neige giống cái).");
q(7,"vocabulaire","Couleurs","La nuit, le ciel est souvent ______.",["noir","blanc","jaune","rouge"],0,"Ban đêm bầu trời thường đen: noir.");
q(7,"vocabulaire","Couleurs","Le ciel est couvert. Les nuages sont ______.",["gris","verts","rouges","jaunes"],0,"Mây xám thì trời âm u: gris (nuages số nhiều).");
q(7,"vocabulaire","Couleurs","Le soleil est souvent représenté en ______.",["jaune","noir","gris","bleu"],0,"Mặt trời thường được vẽ màu vàng: jaune.");
q(7,"vocabulaire","Couleurs","Elle porte une robe ______ comme une tomate.",["rouge","blanche","grise","verte"],0,"So sánh với tomate (cà chua) → màu đỏ: rouge.");
q(7,"vocabulaire","Couleurs","Il aime les vêtements de couleur ______, comme l'herbe.",["vert","noir","blanc","gris"],0,"So sánh với herbe (cỏ) → màu xanh lá: vert.");
q(7,"vocabulaire","Couleurs","Elle achète un pantalon ______ pour une tenue élégante.",["noir","rouge","jaune","vert"],0,"Quần đen (noir) thường được coi là thanh lịch.");
q(7,"vocabulaire","Couleurs","La chemise de Paul n'est ni blanche ni noire : elle est ______.",["grise","rouge","jaune","verte"],0,"Không trắng không đen → màu xám: grise (chemise giống cái).");
/* Từ vựng: kích cỡ, giá, số đếm */
q(7,"vocabulaire","Taille et prix","« Vous faites quelle ______ ? » — « Je fais du 38. »",["taille","prix","couleur","voyage"],0,"Câu hỏi về cỡ quần áo dùng 'la taille'; trả lời 'je fais du 38'.");
q(7,"vocabulaire","Taille et prix","« Combien coûte cette robe ? » — « Le ______ est de 60 euros. »",["prix","taille","salon","métro"],0,"Le prix = giá cả. Câu hỏi về tiền thì trả lời bằng prix.");
q(7,"vocabulaire","Taille et prix","Ce tee-shirt coûte 20 ______.",["euros","tailles","robes","couleurs"],0,"Đơn vị tiền tệ châu Âu là euros.");
q(7,"vocabulaire","Taille et prix","« Ce pantalon coûte combien ? » — « Il ______ 45 euros. »",["coûte","visite","voyage","habite"],0,"Động từ coûter = có giá. 'Il coûte 45 euros'.");
q(7,"vocabulaire","Taille et prix","Cette veste coûte 150 euros. Elle est très ______.",["chère","calme","claire","ancienne"],0,"Giá cao thì nói 'c'est cher / elle est chère' (veste giống cái).");
q(7,"vocabulaire","Nombres","70 euros se dit :",["soixante-dix euros","soixante et onze euros","quatre-vingts euros","cent euros"],0,"70 = soixante-dix (60 + 10).");
q(7,"vocabulaire","Nombres","Le magasin affiche le prix de 80 euros. On dit :",["quatre-vingts","quatre-vingt-dix","soixante-dix","mille"],0,"80 = quatre-vingts (4 × 20), có 's' khi không theo sau bởi số khác.");
q(7,"vocabulaire","Nombres","Le prix est de 91 euros. On dit :",["quatre-vingt-onze","quatre-vingt-dix","quatre-vingts","soixante et onze"],0,"91 = quatre-vingt-onze (80 + 11).");
q(7,"vocabulaire","Nombres","Ce vélo coûte 200 euros. Le nombre est :",["deux cents","deux mille","cent deux","vingt cents"],0,"200 = deux cents. 'Cent' lấy 's' khi ở dạng số nhiều và không theo sau bởi số khác.");
q(7,"vocabulaire","Nombres","La voiture coûte 1000 euros. On dit :",["mille","cent","deux cents","quatre-vingts"],0,"1000 = mille. Chú ý: 'mille' không bao giờ có 's'.");
q(7,"vocabulaire","Nombres","71 se dit :",["soixante et onze","soixante-dix","quatre-vingt-onze","septante et un"],0,"71 = soixante et onze (có 'et' vì 1).");
q(7,"vocabulaire","Nombres","90 se dit :",["quatre-vingt-dix","quatre-vingts","nonante","neuf-dix"],0,"90 = quatre-vingt-dix (80 + 10), không có 's'.");
q(7,"vocabulaire","Nombres","100 se dit :",["cent","mille","dix","cents"],0,"100 = cent (số ít, không có 's').");
/* Ngữ pháp: tính từ chỉ định */
q(7,"grammaire","Adjectifs démonstratifs","___ pantalon est très beau.",["Ce","Cette","Ces","Cet"],0,"Pantalon là danh từ giống đực số ít, bắt đầu bằng phụ âm → dùng 'ce'.");
q(7,"grammaire","Adjectifs démonstratifs","J'aime ___ robe rouge.",["cette","ce","cet","ces"],0,"Robe là danh từ giống cái số ít → dùng 'cette'.");
q(7,"grammaire","Adjectifs démonstratifs","Regarde ___ hôtel !",["cet","ce","cette","ces"],0,"Hôtel giống đực số ít, bắt đầu bằng nguyên âm/h câm → dùng 'cet'.");
q(7,"grammaire","Adjectifs démonstratifs","___ chaussures sont chères.",["Ces","Cette","Cet","Ce"],0,"Chaussures là số nhiều → dùng 'ces'.");
q(7,"grammaire","Adjectifs démonstratifs","Tu préfères ___ chemise blanche ?",["cette","ce","cet","ces"],0,"Chemise giống cái số ít → 'cette'.");
q(7,"grammaire","Adjectifs démonstratifs","___ appartement est grand.",["Cet","Cette","Ces","Ce"],0,"Appartement giống đực số ít, bắt đầu bằng nguyên âm 'a' → 'cet'.");
q(7,"grammaire","Adjectifs démonstratifs","J'achète ___ lunettes.",["ces","ce","cette","cet"],0,"Lunettes luôn ở số nhiều → 'ces'.");
q(7,"grammaire","Adjectifs démonstratifs","___ blouson est noir.",["Ce","Cet","Cette","Ces"],0,"Blouson giống đực số ít, bắt đầu bằng phụ âm → 'ce'.");
q(7,"grammaire","Adjectifs démonstratifs","Elle aime ___ objets.",["Ces","Cette","Ce","Cet"],0,"Objets số nhiều → 'ces'.");
q(7,"grammaire","Adjectifs démonstratifs","___ manteau coûte 100 euros.",["Ce","Cet","Cette","Ces"],0,"Manteau giống đực số ít, phụ âm đầu → 'ce'.");
q(7,"grammaire","Adjectifs démonstratifs","___ amie est très sympathique.",["Cette","Ce","Cet","Ces"],0,"Amie giống cái số ít → 'cette'.");
q(7,"grammaire","Adjectifs démonstratifs","___ arbre est très grand.",["Cet","Ce","Cette","Ces"],0,"Arbre giống đực số ít, bắt đầu bằng nguyên âm → 'cet'.");
/* Ngữ pháp: tính từ nghi vấn */
q(7,"grammaire","Adjectifs interrogatifs","___ pantalon tu préfères ?",["Quel","Quelle","Quels","Quelles"],0,"Pantalon giống đực số ít → 'quel'.");
q(7,"grammaire","Adjectifs interrogatifs","___ couleur aimes-tu ?",["Quelle","Quel","Quels","Quelles"],0,"Couleur giống cái số ít → 'quelle'.");
q(7,"grammaire","Adjectifs interrogatifs","___ vêtements achètes-tu ?",["Quels","Quel","Quelle","Quelles"],0,"Vêtements giống đực số nhiều → 'quels'.");
q(7,"grammaire","Adjectifs interrogatifs","___ chaussures sont à ta taille ?",["Quelles","Quel","Quelle","Quels"],0,"Chaussures giống cái số nhiều → 'quelles'.");
q(7,"grammaire","Adjectifs interrogatifs","___ robe est la plus jolie ?",["Quelle","Quel","Quels","Quelles"],0,"Robe giống cái số ít → 'quelle'.");
q(7,"grammaire","Adjectifs interrogatifs","___ prix fait ce sac ?",["Quel","Quelle","Quels","Quelles"],0,"Prix giống đực số ít → 'quel'.");
/* Ngữ pháp: Comment / Combien */
q(7,"grammaire","Comment / Combien","— Comment tu trouves ce pull ? — ______",["Il est très joli.","Il coûte 30 euros.","Il est à la banque.","Il est chez moi."],0,"'Comment tu trouves...' hỏi ý kiến/nhận xét → trả lời bằng tính từ như 'très joli'.");
q(7,"grammaire","Comment / Combien","— Combien coûte cette chemise ? — ______",["Elle coûte 25 euros.","Elle est rouge.","Elle est devant.","Elle est grande."],0,"'Combien coûte' hỏi giá → trả lời bằng số tiền.");
q(7,"grammaire","Comment / Combien","— Ça fait combien ? — ______",["Ça fait 80 euros.","C'est un hôtel.","C'est à gauche.","C'est noir."],0,"'Ça fait combien ?' hỏi tổng số tiền → trả lời 'Ça fait + số tiền'.");

/* ============================================================
   2. TIỆN ÍCH
   ============================================================ */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const LETTERS = ["A","B","C","D"];

/* ============================================================
   3. LƯU TRỮ
   ============================================================ */
const PROG_KEY = "fr_a1_progress_v1";
const SESS_KEY = "fr_a1_session_v1";

function defaultProgress(){
  return {
    quizzesCompleted: 0,
    totalAnswered: 0,
    totalCorrect: 0,
    totalIncorrect: 0,
    bestScore: 0,
    bestTotal: 0,
    history: [],
    lessons: {},
    wrongIds: {},
    seenIds: {}
  };
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(PROG_KEY);
    if(!raw) return defaultProgress();
    const p = JSON.parse(raw);
    return Object.assign(defaultProgress(), p);
  }catch(e){ return defaultProgress(); }
}
function saveProgress(p){
  try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){}
}

let saveTimer = null;
function saveSession(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      if(!state.quiz){ localStorage.removeItem(SESS_KEY); return; }
      localStorage.setItem(SESS_KEY, JSON.stringify({
        mode: state.quiz.mode,
        title: state.quiz.title,
        questions: state.quiz.questions,
        index: state.quiz.index,
        startedAt: state.quiz.startedAt
      }));
    }catch(e){}
  }, 350);
}
function loadSession(){
  try{
    const raw = localStorage.getItem(SESS_KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s || !Array.isArray(s.questions) || !s.questions.length) return null;
    return s;
  }catch(e){ return null; }
}
function clearSession(){
  if(saveTimer) clearTimeout(saveTimer);
  try{ localStorage.removeItem(SESS_KEY); }catch(e){}
}

/* ============================================================
   4. TẠO ĐỀ
   ============================================================ */
const state = {
  view: "home",
  quiz: null,
  result: null,
  notice: "",
  navOpen: false,
  lastConfig: null
};

function prepareQuestion(item){
  const order = shuffle(item.options.map((_, i) => i));
  const options = order.map(i => item.options[i]);
  const correct = order.indexOf(item.correct);
  return {
    id: item.id,
    lesson: item.lesson,
    category: item.category,
    topic: item.topic,
    question: item.question,
    explanation: item.explanation,
    options,
    correct,
    selected: null
  };
}

/* FIX 1: thêm tham số skipShuffle để giữ nguyên thứ tự ưu tiên cho chế độ "smart" */
function buildQuiz(mode, title, pool, limit, skipShuffle){
  let picked = skipShuffle ? pool.slice() : shuffle(pool);
  const available = picked.length;
  if(limit && picked.length > limit) picked = picked.slice(0, limit);
  if(!picked.length){
    state.notice = "Không có câu hỏi nào phù hợp với chế độ này. Hãy thử chế độ khác.";
    state.view = "home";
    render();
    return;
  }
  state.notice = (limit && available < limit)
    ? "Ngân hàng chỉ có " + available + " câu cho chế độ này, nên bài luyện tập gồm " + available + " câu."
    : "";
  state.quiz = {
    mode: mode,
    title: title,
    questions: picked.map(prepareQuestion),
    index: 0,
    startedAt: Date.now()
  };
  state.result = null;
  state.view = "quiz";
  state.navOpen = false;
  saveSession();
  render();
}

function smartPool(){
  const p = loadProgress();
  const wrong = BANK.filter(x => p.wrongIds[x.id]);
  const unseen = BANK.filter(x => !p.seenIds[x.id] && !p.wrongIds[x.id]);
  const rest = BANK.filter(x => p.seenIds[x.id] && !p.wrongIds[x.id]);
  return shuffle(wrong).concat(shuffle(unseen)).concat(shuffle(rest));
}

function startMode(mode){
  if(mode === "mixed") return buildQuiz("mixed","Luyện tập tổng hợp 30 câu", BANK, 30);
  if(mode === "vocab") return buildQuiz("vocab","Luyện tập từ vựng", BANK.filter(x => x.category === "vocabulaire"), 30);
  if(mode === "grammar") return buildQuiz("grammar","Luyện tập ngữ pháp", BANK.filter(x => x.category === "grammaire"), 30);
  /* FIX 1: truyền skipShuffle = true để giữ thứ tự ưu tiên (sai → chưa gặp → còn lại) */
  if(mode === "smart") return buildQuiz("smart","Ôn tập thông minh", smartPool(), 30, true);
  if(mode === "mistakes"){
    const p = loadProgress();
    const pool = BANK.filter(x => p.wrongIds[x.id]);
    if(!pool.length){
      state.notice = "Bạn chưa có câu trả lời sai nào. Hãy làm một bài kiểm tra trước nhé!";
      state.view = "home";
      render();
      return;
    }
    return buildQuiz("mistakes","Ôn tập câu sai", pool, 30);
  }
  if(mode === "full") return buildQuiz("full","Luyện tập toàn bộ ngân hàng (" + BANK.length + " câu)", BANK, null);
}
function startLesson(lesson){
  buildQuiz("lesson","Leçon " + lesson + " — " + LESSON_NAMES[lesson],
            BANK.filter(x => x.lesson === lesson), 30);
}

function render(){
  switch(state.view){
    case "home":      App.innerHTML = viewHome(); break;
    case "quiz":      App.innerHTML = viewQuiz(); break;
    case "result":    App.innerHTML = viewResult(); break;
    case "review":    App.innerHTML = viewReview(); break;
    case "dashboard": App.innerHTML = viewDashboard(); break;
    case "mistakes":  App.innerHTML = viewMistakes(); break;
  }
  window.scrollTo(0, 0);
}

/* ---------- TRANG KẾT QUẢ ---------- */
function viewResult(){
  const r = state.result;
  if(!r) return viewHome();
  const pct = Math.round(r.correct / r.total * 100);
  let msg, color;
  if(pct >= 90){ msg = "Xuất sắc ! Bạn nắm bài rất tốt."; color = "var(--ok)"; }
  else if(pct >= 75){ msg = "Rất tốt ! Chỉ cần ôn thêm vài điểm nhỏ."; color = "var(--ok)"; }
  else if(pct >= 60){ msg = "Khá tốt. Hãy xem lại phần giải thích bên dưới."; color = "var(--primary-d)"; }
  else if(pct >= 40){ msg = "Cần ôn thêm. Đừng lo, hãy luyện lại vài lần nữa."; color = "var(--warn)"; }
  else { msg = "Hãy tiếp tục luyện tập ! Mỗi lần làm lại bạn sẽ tiến bộ hơn."; color = "var(--warn)"; }

  const lessonRows = [7,8,9,10,11,12].map(l => {
    const items = r.questions.filter(x => x.lesson === l);
    if(!items.length) return "";
    const ok = items.filter(x => x.selected === x.correct).length;
    return `<div class="lessonbar">
      <div class="lb-head"><span>Leçon ${l} — ${esc(LESSON_NAMES[l])}</span><span>${ok}/${items.length}</span></div>
      <div class="lb-track"><div class="lb-fill" style="width:${(ok / items.length * 100).toFixed(1)}%"></div></div>
    </div>`;
  }).join("");

  return `
  <div class="card scorecard">
    <h2>KẾT QUẢ BÀI KIỂM TRA</h2>
    <div class="big">${r.correct}/${r.total}</div>
    <div class="pct">Tỷ lệ đúng : ${pct}%</div>
    <div class="msg" style="color:${color}">${esc(msg)}</div>
    <div class="stats">
      <div class="stat ok"><div class="n">${r.correct}</div><div class="l">Đúng</div></div>
      <div class="stat bad"><div class="n">${r.wrong}</div><div class="l">Sai</div></div>
      <div class="stat warn"><div class="n">${r.blank}</div><div class="l">Chưa trả lời</div></div>
      <div class="stat"><div class="n">${r.timeText}</div><div class="l">Thời gian</div></div>
    </div>
    <div class="row center">
      <button class="btn primary" data-act="new-quiz">🔄 Làm đề mới</button>
      <button class="btn ghost" data-act="retry-same">↻ Làm lại đề hiện tại</button>
      <button class="btn ghost" data-act="show-review">📖 Xem chi tiết đáp án</button>
      <button class="btn ghost" data-act="home">🏠 Quay về trang chủ</button>
    </div>
  </div>
  <div class="card">
    <h2>Kết quả theo từng bài</h2>
    ${lessonRows || "<p>Không có dữ liệu.</p>"}
  </div>`;
}

/* ---------- XEM LẠI CHI TIẾT ---------- */
function viewReview(){
  const qz = state.quiz;
  if(!qz) return viewHome();
  const items = qz.questions.map((qq, i) => {
    const isBlank = qq.selected === null;
    const isCorrect = qq.selected === qq.correct;
    const status = isBlank ? "blank" : (isCorrect ? "correct" : "incorrect");
    const statusText = isBlank ? "Chưa trả lời" : (isCorrect ? "Đúng" : "Sai");
    const userText = isBlank ? "—" : LETTERS[qq.selected] + ". " + esc(qq.options[qq.selected]);
    return `
    <div class="revitem ${status}">
      <div class="row" style="justify-content:space-between">
        <strong>Câu ${i + 1}</strong>
        <span class="pill ${status}">${statusText}</span>
      </div>
      <div class="tag" style="margin-top:8px">Leçon ${qq.lesson} · ${qq.category === "vocabulaire" ? "Từ vựng" : "Ngữ pháp"} · ${esc(qq.topic)}</div>
      <div class="rq">${esc(qq.question)}</div>
      <div class="ansline">Bạn chọn : <b>${userText}</b></div>
      <div class="ansline">Đáp án đúng : <b>${LETTERS[qq.correct]}. ${esc(qq.options[qq.correct])}</b></div>
      <div class="expl"><b>Giải thích :</b> ${esc(qq.explanation)}</div>
    </div>`;
  }).join("");

  return `
  <div class="qhead">
    <button class="btn ghost small" data-act="back-result">← Kết quả</button>
    <span class="qtitle">Chi tiết đáp án</span>
    <span class="qcount">${qz.questions.length} câu</span>
  </div>
  ${items}
  <div class="row center" style="margin-top:16px">
    <button class="btn primary" data-act="new-quiz">🔄 Làm đề mới</button>
    <button class="btn ghost" data-act="retry-same">↻ Làm lại đề hiện tại</button>
    <button class="btn ghost" data-act="home">🏠 Quay về trang chủ</button>
  </div>`;
}

/* ---------- BẢNG TIẾN ĐỘ ---------- */
function viewDashboard(){
  const p = loadProgress();
  const acc = p.totalAnswered ? Math.round(p.totalCorrect / p.totalAnswered * 100) : 0;

  const lessonBars = [7,8,9,10,11,12].map(l => {
    const s = p.lessons[l] || { answered: 0, correct: 0 };
    const a = s.answered;
    const pct = a ? Math.round(s.correct / a * 100) : 0;
    return `<div class="lessonbar">
      <div class="lb-head">
        <span>Leçon ${l} — ${esc(LESSON_NAMES[l])}</span>
        <span>${a ? s.correct + "/" + a + " (" + pct + "%)" : "chưa làm"}</span>
      </div>
      <div class="lb-track"><div class="lb-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join("");

  const history = p.history.length ? p.history.map(h => `
    <div class="ansline" style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eef3f9;padding:6px 0">
      <span>${esc(h.title)}</span>
      <span><b>${h.score}/${h.total}</b> · ${h.percent}% <span style="color:var(--muted);font-size:.85em">${new Date(h.date).toLocaleDateString("vi-VN")}</span></span>
    </div>`).join("") : "<p>Chưa có lượt luyện tập nào.</p>";

  return `
  <div class="qhead">
    <button class="btn ghost small" data-act="home">← Trang chủ</button>
    <span class="qtitle">TỔNG QUAN HỌC TẬP</span>
    <span></span>
  </div>

  <div class="card">
    <h2>Thống kê chung</h2>
    <div class="stats">
      <div class="stat"><div class="n">${p.quizzesCompleted}</div><div class="l">Bài đã làm</div></div>
      <div class="stat"><div class="n">${p.totalAnswered}</div><div class="l">Câu đã trả lời</div></div>
      <div class="stat ok"><div class="n">${acc}%</div><div class="l">Tỷ lệ chính xác</div></div>
      <div class="stat"><div class="n">${p.bestScore}/${p.bestTotal || 30}</div><div class="l">Điểm cao nhất</div></div>
      <div class="stat bad"><div class="n">${p.totalIncorrect}</div><div class="l">Câu sai</div></div>
      <div class="stat warn"><div class="n">${Object.keys(p.wrongIds).length}</div><div class="l">Câu cần ôn</div></div>
    </div>
    <p class="hint">Dữ liệu chỉ được lưu trong trình duyệt của bạn.</p>
  </div>

  <div class="card">
    <h2>Kết quả theo từng bài</h2>
    ${lessonBars}
  </div>

  <div class="card">
    <h2>Lịch sử gần đây</h2>
    ${history}
  </div>

  <div class="card">
    <h2>Quản lý dữ liệu</h2>
    <div class="row">
      <button class="btn ghost" data-act="mistakes-page">📝 Mở sổ tay câu sai</button>
      <button class="btn ghost" data-act="reset-progress" style="color:var(--bad);border-color:#f0c9c6">🗑️ Xóa toàn bộ tiến độ</button>
    </div>
  </div>

  <div class="row center">
    <button class="btn primary" data-act="home">🏠 Quay về trang chủ</button>
  </div>`;
}

/* ---------- SỔ TAY CÂU SAI ---------- */
function viewMistakes(){
  const p = loadProgress();
  const ids = Object.keys(p.wrongIds).map(Number);
  const items = ids.map(id => BANK.find(x => x.id === id)).filter(Boolean);

  if(!items.length){
    return `
    <div class="qhead">
      <button class="btn ghost small" data-act="home">← Trang chủ</button>
      <span class="qtitle">SỔ TAY CÂU SAI</span><span></span>
    </div>
    <div class="card">
      <h2>Chưa có câu sai nào 🎉</h2>
      <p>Bạn chưa trả lời sai câu nào. Hãy làm một bài kiểm tra để bắt đầu ghi lại những câu cần ôn tập.</p>
      <div class="row"><button class="btn primary" data-act="new-quiz">🎯 Làm bài kiểm tra</button></div>
    </div>`;
  }

  const blocks = items.map((item, idx) => {
    const similar = BANK.find(x => x.topic === item.topic && x.id !== item.id);
    const count = p.wrongIds[item.id] || 1;
    return `
    <details class="mistake">
      <summary>Câu ${idx + 1} · Leçon ${item.lesson} · ${esc(item.topic)} <span class="pill incorrect">sai ${count} lần</span></summary>
      <div class="rq">${esc(item.question)}</div>
      <div class="ansline">Đáp án đúng : <b>${esc(item.options[item.correct])}</b></div>
      <div class="expl"><b>Giải thích :</b> ${esc(item.explanation)}</div>
      ${similar ? `
      <div class="similar">
        <b>🔁 Câu luyện tập tương tự :</b><br>
        ${esc(similar.question)}<br>
        <span style="color:var(--ok)"><b>Đáp án :</b> ${esc(similar.options[similar.correct])}</span><br>
        <span style="color:var(--muted)">${esc(similar.explanation)}</span>
      </div>` : ""}
    </details>`;
  }).join("");

  return `
  <div class="qhead">
    <button class="btn ghost small" data-act="home">← Trang chủ</button>
    <span class="qtitle">SỔ TAY CÂU SAI (${items.length})</span><span></span>
  </div>
  <div class="card">
    <p class="hint" style="margin:0 0 12px">Nhấn vào từng câu để xem đáp án, giải thích và một câu luyện tập tương tự.</p>
    ${blocks}
    <div class="row center" style="margin-top:14px">
      <button class="btn primary" data-act="start" data-mode="mistakes">🔁 Luyện tập các câu sai</button>
      <button class="btn ghost" data-act="dashboard">📊 Xem tiến độ</button>
    </div>
  </div>`;
}

/* ============================================================
   6. XỬ LÝ SỰ KIỆN
   ============================================================ */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "home"){
    state.view = "home";
    state.notice = "";
    render();
    return;
  }

  if(act === "start"){
    const mode = el.dataset.mode;
    if(mode === "lesson") startLesson(Number(el.dataset.lesson));
    else startMode(mode);
    return;
  }

  if(act === "dashboard"){ state.view = "dashboard"; render(); return; }
  if(act === "mistakes-page"){ state.view = "mistakes"; render(); return; }

  if(act === "resume"){
    const s = loadSession();
    if(s){
      state.quiz = {
        mode: s.mode, title: s.title, questions: s.questions,
        index: Math.min(s.index || 0, s.questions.length - 1),
        startedAt: s.startedAt || Date.now()
      };
      state.result = null;
      state.view = "quiz";
      render();
    }
    return;
  }
  if(act === "discard-session"){
    clearSession();
    state.notice = "Đã xóa lượt luyện tập đang dang dở.";
    render();
    return;
  }
  if(act === "pause"){
    saveSession();
    state.notice = "Đã lưu lượt luyện tập. Bạn có thể tiếp tục sau.";
    state.view = "home";
    render();
    return;
  }

  if(act === "opt"){
    if(!state.quiz) return;
    const i = Number(el.dataset.i);
    const qq = state.quiz.questions[state.quiz.index];
    qq.selected = (qq.selected === i) ? null : i;
    saveSession();
    render();
    return;
  }

  if(act === "prev"){
    if(!state.quiz || state.quiz.index === 0) return;
    state.quiz.index--;
    saveSession();
    render();
    return;
  }
  if(act === "next"){
    if(!state.quiz) return;
    if(state.quiz.index < state.quiz.questions.length - 1){
      state.quiz.index++;
      saveSession();
      render();
    }
    return;
  }
  if(act === "goto"){
    if(!state.quiz) return;
    const i = Number(el.dataset.i);
    if(i >= 0 && i < state.quiz.questions.length){
      state.quiz.index = i;
      saveSession();
      render();
    }
    return;
  }
  if(act === "toggle-nav"){
    state.navOpen = !state.navOpen;
    render();
    return;
  }

  if(act === "submit"){
    finishQuiz();
    return;
  }

  if(act === "back-result"){ state.view = "result"; render(); return; }
  if(act === "show-review"){ state.view = "review"; render(); return; }

  if(act === "retry-same"){
    if(!state.quiz) return;
    const ids = state.quiz.questions.map(x => x.id);
    const pool = ids.map(id => BANK.find(b => b.id === id)).filter(Boolean);
    state.quiz = {
      mode: state.quiz.mode,
      title: state.quiz.title,
      questions: shuffle(pool).map(prepareQuestion),
      index: 0,
      startedAt: Date.now()
    };
    state.result = null;
    state.view = "quiz";
    state.navOpen = false;
    saveSession();
    render();
    return;
  }

  if(act === "new-quiz"){
    const m = state.quiz ? state.quiz.mode : "mixed";
    if(m === "lesson"){
      const l = state.quiz.questions[0] ? state.quiz.questions[0].lesson : 7;
      startLesson(l);
    } else {
      startMode(m);
    }
    return;
  }

  if(act === "reset-progress"){
    if(confirm("Bạn có chắc muốn xóa toàn bộ tiến độ học tập? Hành động này không thể hoàn tác.")){
      localStorage.removeItem(PROG_KEY);
      clearSession();
      state.notice = "Đã xóa toàn bộ tiến độ học tập.";
      state.view = "home";
      render();
    }
    return;
  }
});

/* Bàn phím: 1-4 chọn đáp án, ← → chuyển câu */
document.addEventListener("keydown", function(e){
  if(state.view !== "quiz" || !state.quiz) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if(tag === "input" || tag === "textarea") return;

  if(["1","2","3","4"].includes(e.key)){
    const i = Number(e.key) - 1;
    const qq = state.quiz.questions[state.quiz.index];
    if(i < qq.options.length){
      qq.selected = (qq.selected === i) ? null : i;
      saveSession();
      render();
    }
    e.preventDefault();
  } else if(e.key === "ArrowLeft"){
    if(state.quiz.index > 0){ state.quiz.index--; saveSession(); render(); }
    e.preventDefault();
  } else if(e.key === "ArrowRight"){
    if(state.quiz.index < state.quiz.questions.length - 1){ state.quiz.index++; saveSession(); render(); }
    e.preventDefault();
  }
});

/* ============================================================
   7. NỘP BÀI & TÍNH ĐIỂM
   ============================================================ */
function finishQuiz(){
  const qz = state.quiz;
  if(!qz) return;

  const answeredCount = qz.questions.filter(x => x.selected !== null).length;
  if(answeredCount < qz.questions.length){
    const remain = qz.questions.length - answeredCount;
    if(!confirm("Bạn còn " + remain + " câu chưa trả lời. Vẫn nộp bài ?")) return;
  }

  const p = loadProgress();
  let correct = 0, wrong = 0, blank = 0;
  const lessonAgg = {};

  qz.questions.forEach(qq => {
    const isBlank = qq.selected === null;
    const isCorrect = qq.selected === qq.correct;

    if(isBlank){ blank++; }
    else {
      if(isCorrect) correct++; else wrong++;
      const L = lessonAgg[qq.lesson] || (lessonAgg[qq.lesson] = { a: 0, c: 0 });
      L.a++;
      if(isCorrect) L.c++;
    }

    if(!isBlank){
      if(isCorrect){
        if(p.wrongIds[qq.id]){
          p.wrongIds[qq.id]--;
          if(p.wrongIds[qq.id] <= 0) delete p.wrongIds[qq.id];
        }
      } else {
        p.wrongIds[qq.id] = (p.wrongIds[qq.id] || 0) + 1;
      }
      p.seenIds[qq.id] = (p.seenIds[qq.id] || 0) + 1;
    }
  });

  const total = qz.questions.length;
  const answered = correct + wrong;

  p.quizzesCompleted++;
  p.totalAnswered += answered;
  p.totalCorrect += correct;
  p.totalIncorrect += wrong;

  /* FIX 2: so sánh kỷ lục theo TỶ LỆ %, không theo số câu tuyệt đối */
  const curPct = total ? correct / total : 0;
  const bestPct = p.bestTotal ? p.bestScore / p.bestTotal : 0;
  if(curPct > bestPct || (curPct === bestPct && correct > p.bestScore)){
    p.bestScore = correct;
    p.bestTotal = total;
  }

  Object.keys(lessonAgg).forEach(k => {
    const s = p.lessons[k] || (p.lessons[k] = { answered: 0, correct: 0 });
    s.answered += lessonAgg[k].a;
    s.correct += lessonAgg[k].c;
  });

  const elapsedMs = Date.now() - (qz.startedAt || Date.now());
  const mins = Math.floor(elapsedMs / 60000);
  const secs = Math.floor((elapsedMs % 60000) / 1000);
  const timeText = mins + ":" + String(secs).padStart(2, "0");

  p.history.unshift({
    date: Date.now(),
    mode: qz.mode,
    title: qz.title,
    score: correct,
    total: total,
    percent: Math.round(correct / total * 100)
  });
  p.history = p.history.slice(0, 25);
  saveProgress(p);

  state.result = {
    correct, wrong, blank, total,
    timeText,
    questions: qz.questions.map(x => Object.assign({}, x))
  };
  state.view = "result";
  clearSession();
  render();
}

/* ============================================================
   8. KHỞI ĐỘNG
   ============================================================ */
render();
</script>
